    // --- DATOS DE PROYECTOS ---
    const projects = Array.from({length:30}, (_,i)=>({
      idx: i+1,
      link: i===0? 'proyecto1.html' : i===1? 'proyecto2.html' : '#',
      // El resto de campos se traducen dinámicamente
    }));
    // --- RENDERIZADO Y FUNCIONALIDAD ---
    function renderProjects(lang, filter=''){
      const t = translations[lang] || translations.es;
      const container = document.getElementById('projectsContainer');
      container.innerHTML = '';
      projects.forEach((proj, i) => {
        const name = t['p'+(i+1)];
        const desc = t['p'+(i+1)+'desc'];
        if(filter && !name.toLowerCase().includes(filter) && !translations.en['p'+(i+1)].toLowerCase().includes(filter)) return;
        const weeks = (i%2===0) ? t.weeks2 : t.weeks3;
        const card = document.createElement('article');
        card.className = 'card project-card';
        card.innerHTML = `
          <div class="card-inner">
            <h2>${name}</h2>
            <p class="muted">${desc}</p>
            <ul>
              <li><strong>${t.authors}</strong> Fran Mendoza</li>
              <li><strong>${t.duration}</strong> ${weeks}</li>
              <li><strong>${t.techs}</strong> ${t.htmlcssjs}</li>
            </ul>
            <div class="card-actions" style="margin-top:14px;display:flex;justify-content:center;">
              <a href="${proj.link}" class="btn">${t.detail}</a>
            </div>
          </div>
        `;
        // Click en la tarjeta abre el detalle
        card.addEventListener('click', (e) => {
          if(e.target.closest('a')) return;
          animateCards();
          const link = card.querySelector('a.btn');
          if(link && link.getAttribute('href')!=='#') setTimeout(()=>{window.location.href=link.getAttribute('href');},260);
        });
        // Hover animación
        const inner = card.querySelector('.card-inner') || card;
        card.addEventListener('mouseenter', () => inner.classList.add('animating'));
        card.addEventListener('mouseleave', () => inner.classList.remove('animating'));
        container.appendChild(card);
      });
    }
    // --- MODO OSCURO Y IDIOMA ---
    function applyDarkFromStorage(){ if(sessionStorage.getItem('modo-oscuro') === '1') document.body.classList.add('oscuro'); }
    applyDarkFromStorage();
    const darkToggle = document.getElementById('darkToggle');
    darkToggle && darkToggle.addEventListener('click', () => { document.body.classList.toggle('oscuro'); sessionStorage.setItem('modo-oscuro', document.body.classList.contains('oscuro') ? '1' : '0'); animateCards(); });
    // --- IDIOMA ---
    const langToggle = document.getElementById('langToggle');
    function applyLangFromStorage(){ const l = sessionStorage.getItem('lang') || 'es'; setLanguage(l); }
    function setLanguage(lang){
      sessionStorage.setItem('lang', lang);
      if(!langToggle) return;
      const flag = langToggle.querySelector('.flag');
      const label = langToggle.querySelector('.label');
      if(lang === 'en'){ flag.textContent = '🇬🇧'; label.textContent = 'EN'; langToggle.classList.add('active'); } else { flag.textContent = '🇪🇸'; label.textContent = 'ES'; langToggle.classList.remove('active'); }
      const t = translations[lang] || translations.es;
      document.title = t.title;
      document.getElementById('brand-text') && (document.getElementById('brand-text').textContent = t.brand);
      document.querySelector('h1') && (document.querySelector('h1').textContent = t.h1);
      document.querySelector('p.muted') && (document.querySelector('p.muted').textContent = t.desc);
      document.getElementById('projectSearch') && (document.getElementById('projectSearch').placeholder = t.search);
      document.querySelector('footer small') && (document.querySelector('footer small').textContent = t.footer);
      document.getElementById('nav-inicio') && (document.getElementById('nav-inicio').textContent = t.nav_inicio);
      document.getElementById('nav-p1') && (document.getElementById('nav-p1').textContent = t.nav_p1);
      document.getElementById('nav-p2') && (document.getElementById('nav-p2').textContent = t.nav_p2);
      document.getElementById('nav-listado') && (document.getElementById('nav-listado').textContent = t.nav_listado);
      document.getElementById('nav-contacto') && (document.getElementById('nav-contacto').textContent = t.nav_contacto);
      renderProjects(lang, document.getElementById('projectSearch')?.value.trim().toLowerCase()||'');
    }
    applyLangFromStorage();
    if(langToggle){
      langToggle.addEventListener('click', ()=>{
        const cur = sessionStorage.getItem('lang') || 'es';
        const next = cur === 'es' ? 'en' : 'es';
        setLanguage(next);
      });
    }
    // --- ANIMACIÓN TARJETAS ---
    function animateCards(){
      const nodes = document.querySelectorAll('.project-card .card-inner, .project-card, .card .card-inner');
      nodes.forEach(el => el.classList.add('animating'));
      setTimeout(() => nodes.forEach(el => el.classList.remove('animating')), 600);
    }
    // --- BUSCADOR ---
    const searchInput = document.getElementById('projectSearch');
    if(searchInput){
      searchInput.addEventListener('input', function(){
        const val = this.value.trim().toLowerCase();
        const lang = sessionStorage.getItem('lang') || 'es';
        renderProjects(lang, val);
      });
    }
