<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Formulario - Fran</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">Fran</span><span class="brand-text"> - Contacto</span></div>
    <div class="actions-right">
      <a href="./index.html" class="btn secondary">Volver al portfolio</a>
      <button id="darkToggle" class="icon-btn" title="Modo oscuro">🌙</button>
    </div>
  </header>

  <main style="max-width:900px;margin:28px auto;padding:0 16px">
    <article class="card">
      <h1>Formulario de contacto</h1>
      <p class="muted">Rellena el formulario y pulsa enviar. Es un ejemplo; aquí no se envía realmente nada al servidor.</p>

      <form id="contactForm" novalidate>
        <label for="name">Nombre</label>
        <input id="name" name="name" type="text" placeholder="Tu nombre" required>

        <label for="email">Correo</label>
        <input id="email" name="email" type="email" placeholder="tu@correo.com" required>

        <label for="subject">Asunto</label>
        <input id="subject" name="subject" type="text" placeholder="Asunto">

        <label for="message">Mensaje</label>
        <textarea id="message" name="message" rows="6" placeholder="Escribe tu mensaje..."></textarea>

        <div style="display:flex;gap:8px;align-items:center">
          <button type="submit" class="btn">Enviar</button>
          <button type="reset" class="btn secondary">Limpiar</button>
        </div>
      </form>

    </article>
  </main>

  <footer>
    <small class="muted">© 2025 Fran • Contacto</small>
  </footer>

  <script>
    // Modo oscuro
    function applyDarkFromStorage(){ if(sessionStorage.getItem('modo-oscuro') === '1') document.body.classList.add('oscuro'); }
    applyDarkFromStorage();
    const darkToggle = document.getElementById('darkToggle');
    darkToggle && darkToggle.addEventListener('click', () => { document.body.classList.toggle('oscuro'); sessionStorage.setItem('modo-oscuro', document.body.classList.contains('oscuro') ? '1' : '0'); });

    // Manejo del formulario (validación básica y demo de patrones)
    document.getElementById('contactForm').addEventListener('submit', function(e){
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      if(!name || !email){ alert('Nombre y correo son obligatorios.'); return; }
      // patrón simple para email
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if(!re.test(email)){ alert('Introduce un correo válido.'); return; }
      // Demo: mostrar datos en consola
      const data = Object.fromEntries(new FormData(this).entries());
      console.log('Formulario demo enviado:', data);
      alert('Gracias, mensaje recibido (demo).');
      this.reset();
    });
  </script>
</body>
</html>
